<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoKart • Log In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="tb-inner">
    <div class="brand-wrap"><span class="leaf">🌿</span><span class="brand-name">EcoKart</span></div>
    <nav class="tb-nav">
      <a class="tb-link" href="index.html">🏠 Home</a>
      <a class="tb-link" href="buy.html">🛒 Buy Products</a>
      <a class="tb-link" href="sell.html">📤 Sell Product</a>
      <a class="tb-link" href="wallet.html">🪙 EcoCoin Wallet</a>
      <a class="tb-link" href="plant.html">🪴 Plant Store</a>
      <a class="tb-link" href="feedback.html">💬 Feedback</a>
      <a class="tb-link active" href="login.html">🔐 Login</a>
    </nav>
  </div>
</header>

<main class="container" style="max-width:420px">
  <h1 class="h1">Log In</h1>
  <form id="loginForm" class="form">
    <div class="input"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required /></div>
    <div class="input"><label>Password</label><input type="password" id="password" placeholder="Your password" required /></div>
    <button class="btn" type="submit" style="width:100%">Log In</button>

    <div style="text-align:center;margin:16px 0 12px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:10px;">
      <span style="flex:1;height:1px;background:#e2e8f0"></span>
      <span>OR</span>
      <span style="flex:1;height:1px;background:#e2e8f0"></span>
    </div>

    <button type="button" id="demoBtn" class="btn" style="width:100%;background:#0284c7;font-weight:700">🚀 Quick Demo / Guest Login</button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px">Instant access to test buying, selling, and plant rewards!</p>
  </form>
  <p id="error" style="color:#c0392b;font-size:14px;min-height:20px;text-align:center"></p>
  <p class="sub" style="text-align:center"><a href="signup.html">Need an account? Sign up</a></p>
</main>

<script>
  // Frontend is served by the backend, so relative URLs work.
  const API_URL = '';

  // Already signed in? Skip the form.
  try { if (localStorage.getItem('token')) location.replace('index.html'); } catch (e) {}

  document.getElementById('demoBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('error');
    errorEl.textContent = 'Connecting demo account...';
    try {
      const res = await fetch(`${API_URL}/api/demo-login`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = 'index.html';
      } else {
        errorEl.textContent = data.error || 'Demo login failed';
      }
    } catch (err) {
      errorEl.textContent = 'Could not reach server.';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = '';

    try {
      const res = await fetch(`${API_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('token', data.token);
        window.location.href = 'index.html';
      } else {
        errorEl.textContent = data.error || 'Login failed';
      }
    } catch (err) {
      errorEl.textContent = 'Could not reach server. Is the backend running?';
    }
  });
</script>
</body>
</html>
